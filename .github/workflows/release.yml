name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  attach-vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run compile -- --production

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX to release
        uses: softprops/action-gh-release@v2
        with:
          files: vsxcode.vsix
